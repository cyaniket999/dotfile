# Performance Backend for Intel UHD
backend = "glx";
vsync = true;
use-damage = true;

# Corners
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Shadows
shadow = false;

# Smooth Fading
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# Base Window Transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Target Application Transparency Rules
opacity-rule = [
  "80:class_g = 'Alacritty'",
  "80:class_g = 'Org.xfce.mousepad'",
#  "80:class_g = 'Pcmanfm'",
  "80:class_g = 'Rofi'"
];

# Optimized Dual-Kawase Background Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# Exclusion Rules (Prevents graphical glitches on panels/menus)
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# General System Settings
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";